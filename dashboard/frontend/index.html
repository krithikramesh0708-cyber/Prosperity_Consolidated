<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosperity Backtest Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f111a;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="custom-scrollbar">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const StatCard = ({ title, value, color }) => (
            <div className="glass-panel p-6 flex flex-col items-center justify-center animate-fade-in">
                <span className="text-gray-400 text-sm font-medium mb-1 uppercase tracking-wider">{title}</span>
                <span className={`text-3xl font-bold ${color}`}>{value}</span>
            </div>
        );

        const Chart = ({ id, options, type, series, height = 350 }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    chartInstance.current = new ApexCharts(chartRef.current, { ...options, series, chart: { ...options.chart, type, height } });
                    chartInstance.current.render();
                }
                return () => chartInstance.current?.destroy();
            }, [id, options, type, height]);

            useEffect(() => {
                chartInstance.current?.updateSeries(series);
            }, [series]);

            return <div ref={chartRef} id={id} />;
        };

        const App = () => {
            const [results, setResults] = useState(null);
            const [loading, setLoading] = useState(false);
            const [files, setFiles] = useState({ trader: null, data: [] });
            const [params, setParams] = useState({ round: 2, day: 1 });

            const handleFileUpload = (type, e) => {
                const uploaded = Array.from(e.target.files);
                if (type === 'trader') {
                    setFiles(prev => ({ ...prev, trader: uploaded[0] }));
                } else {
                    setFiles(prev => ({ ...prev, data: uploaded }));
                }
            };

            const runBacktest = async () => {
                if (!files.trader || files.data.length === 0) {
                    alert("Please upload both trader.py and data files (.zip or .csvs)");
                    return;
                }

                setLoading(true);
                const formData = new FormData();
                formData.append('trader_file', files.trader);
                
                // Append all data files
                files.data.forEach(file => {
                    formData.append('data_files', file);
                });
                
                formData.append('round_num', params.round);
                formData.append('day_num', params.day);

                try {
                    const response = await fetch('/backtest', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (response.ok) {
                        setResults(data);
                    } else {
                        alert(`Error: ${data.detail || 'Backtest failed'}`);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Failed to run backtest. Check console.");
                } finally {
                    setLoading(false);
                }
            };

            const pnlData = useMemo(() => {
                if (!results) return [];
                // Group activity logs by timestamp and sum profit
                const tsMap = new Map();
                results.activity_logs.forEach(log => {
                    const ts = log.timestamp;
                    const profit = log.columns[log.columns.length - 1];
                    tsMap.set(ts, (tsMap.get(ts) || 0) + profit);
                });
                return Array.from(tsMap.entries())
                    .sort((a, b) => a[0] - b[0])
                    .map(([ts, profit]) => ({ x: ts, y: Math.round(profit) }));
            }, [results]);

            const stats = useMemo(() => {
                if (!results || pnlData.length === 0) return { total: 0, sharpe: 0, trades: 0 };
                const total = pnlData[pnlData.length - 1].y;
                const tradesCount = results.trades.length;
                return { total, sharpe: "N/A", trades: tradesCount };
            }, [results, pnlData]);

            return (
                <div className="min-h-screen p-6 lg:p-10 max-w-[1700px] mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-end md:items-center mb-10 gap-6">
                        <div>
                            <h1 className="text-4xl font-bold gradient-text mb-2 tracking-tight">Prosperity Engine v2</h1>
                            <p className="text-gray-400 font-light">Advanced backtesting with ZIP & Multi-file support</p>
                        </div>
                        
                        <div className="flex flex-wrap gap-4 items-center">
                            <div className="flex gap-2">
                                <input 
                                    type="number" 
                                    placeholder="Round" 
                                    className="glass-panel bg-transparent px-4 py-2 w-24 text-center focus:outline-none focus:ring-1 ring-indigo-500"
                                    value={params.round}
                                    onChange={e => setParams(p => ({...p, round: parseInt(e.target.value)}))}
                                />
                                <input 
                                    type="number" 
                                    placeholder="Day" 
                                    className="glass-panel bg-transparent px-4 py-2 w-24 text-center focus:outline-none focus:ring-1 ring-indigo-500"
                                    value={params.day}
                                    onChange={e => setParams(p => ({...p, day: parseInt(e.target.value)}))}
                                />
                            </div>
                            
                            <label className="cursor-pointer glass-panel px-6 py-2 hover:bg-white/5 transition-colors flex items-center gap-2">
                                <i className="lucide-python text-blue-400 w-4 h-4"></i>
                                <span className={files.trader ? "text-green-400" : "text-gray-300"}>
                                    {files.trader ? files.trader.name : "Upload trader.py"}
                                </span>
                                <input type="file" className="hidden" accept=".py" onChange={e => handleFileUpload('trader', e)} />
                            </label>

                            <label className="cursor-pointer glass-panel px-6 py-2 hover:bg-white/5 transition-colors flex items-center gap-2">
                                <i className="lucide-archive text-indigo-400 w-4 h-4"></i>
                                <span className={files.data.length > 0 ? "text-green-400" : "text-gray-300"}>
                                    {files.data.length > 0 ? `${files.data.length} files selected` : "Upload Data (.zip or .csvs)"}
                                </span>
                                <input type="file" className="hidden" accept=".csv,.zip" multiple onChange={e => handleFileUpload('data', e)} />
                            </label>

                            <button 
                                onClick={runBacktest}
                                disabled={loading}
                                className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-8 py-2 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:active:scale-100"
                            >
                                {loading ? "Running..." : "Run Backtest"}
                            </button>
                        </div>
                    </header>

                    {results ? (
                        <div className="space-y-8 animate-fade-in">
                            {results.found_files && (
                                <div className="flex gap-4 mb-2">
                                    {Object.entries(results.found_files).map(([key, found]) => (
                                        <div key={key} className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium border ${found ? 'text-green-400 border-green-500/20 bg-green-500/5' : 'text-red-400 border-red-500/20 bg-red-500/5'}`}>
                                            <i className={`lucide-${found ? 'check-circle' : 'x-circle'} w-3 h-3`}></i>
                                            <span className="capitalize">{key}</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                <StatCard title="Total PnL" value={stats.total.toLocaleString()} color={stats.total >= 0 ? "text-green-400" : "text-red-400"} />
                                <StatCard title="Total Trades" value={stats.trades} color="text-indigo-300" />
                                <StatCard title="Sharpe Ratio" value={stats.sharpe} color="text-purple-300" />
                                <StatCard title="Accuracy" value="Calculated" color="text-blue-300" />
                            </div>

                            <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                                <div className="xl:col-span-2 glass-panel p-6">
                                    <h3 className="text-xl font-semibold mb-6 flex items-center gap-2 text-gray-200">
                                        <i className="lucide-line-chart w-5 h-5 text-indigo-400"></i>
                                        Equity Curve (Cumulative PnL)
                                    </h3>
                                    <Chart 
                                        id="pnl-chart"
                                        type="area"
                                        series={[{ name: 'PnL', data: pnlData }]}
                                        options={{
                                            chart: { toolbar: { show: true }, background: 'transparent' },
                                            stroke: { curve: 'smooth', width: 2, colors: ['#6366f1'] },
                                            fill: {
                                                type: 'gradient',
                                                gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0, stops: [0, 90, 100] }
                                            },
                                            xaxis: { type: 'numeric', labels: { style: { colors: '#94a3b8' } } },
                                            yaxis: { labels: { style: { colors: '#94a3b8' } } },
                                            theme: { mode: 'dark' },
                                            grid: { borderColor: 'rgba(255,255,255,0.05)' }
                                        }}
                                    />
                                </div>

                                <div className="glass-panel p-6 flex flex-col h-full">
                                    <h3 className="text-xl font-semibold mb-6 flex items-center gap-2 text-gray-200">
                                        <i className="lucide-history w-5 h-5 text-purple-400"></i>
                                        Recent Trades
                                    </h3>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 max-h-[350px]">
                                        <table className="w-full text-sm">
                                            <thead>
                                                <tr className="text-gray-500 border-b border-white/5 py-2">
                                                    <th className="text-left font-normal pb-2">Time</th>
                                                    <th className="text-left font-normal pb-2">Symbol</th>
                                                    <th className="text-right font-normal pb-2">Price</th>
                                                    <th className="text-right font-normal pb-2">Size</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5">
                                                {results.trades.slice(-50).map((t, i) => (
                                                    <tr key={i} className="hover:bg-white/5 transition-colors">
                                                        <td className="py-3 text-gray-400">{t.timestamp}</td>
                                                        <td className="py-3 font-medium text-gray-200">{t.symbol}</td>
                                                        <td className="py-3 text-right text-gray-300">{Math.round(t.price)}</td>
                                                        <td className={`py-3 text-right font-semibold ${t.buyer === "SUBMISSION" ? 'text-green-400' : 'text-red-400'}`}>
                                                            {t.buyer === "SUBMISSION" ? `+${t.quantity}` : `-${t.quantity}`}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="glass-panel p-6">
                                <h3 className="text-xl font-semibold mb-6 flex items-center gap-2 text-gray-200">
                                    <i className="lucide-terminal w-5 h-5 text-gray-400"></i>
                                    Sandbox Logs
                                </h3>
                                <div className="bg-[#05060a] rounded-lg p-6 font-mono text-sm h-[300px] overflow-y-auto custom-scrollbar text-gray-300 border border-white/5 shadow-inner">
                                    {results.sandbox_logs.slice(-200).map((log, i) => (
                                        <div key={i} className="mb-4">
                                            <div className="text-indigo-400 mb-1 opacity-60">[{log.timestamp}] System:</div>
                                            <div className="pl-4 whitespace-pre-wrap">{log.lambda_log || 'Empty log'}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="h-[60vh] flex flex-col items-center justify-center glass-panel animate-fade-in text-center">
                            <i className="lucide-zap w-16 h-16 text-indigo-500 mb-6 opacity-40"></i>
                            <h2 className="text-2xl font-semibold text-gray-300 mb-2">Backtester v2 Ready</h2>
                            <p className="text-gray-500 mb-6 max-w-md">Upload your <b>trader.py</b> and your <b>data ZIP</b> or individual CSVs. We'll automatically identify Prices, Trades, and Observations.</p>
                            <div className="flex gap-4">
                                <div className="text-xs text-gray-600 uppercase tracking-widest bg-white/5 px-3 py-1 rounded">Auto-Zip Support</div>
                                <div className="text-xs text-gray-600 uppercase tracking-widest bg-white/5 px-3 py-1 rounded">Multi-CSV Logic</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Lucide icons
        window.addEventListener('load', () => lucide.createIcons());
    </script>
</body>
</html>
